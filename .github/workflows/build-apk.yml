name: Build Android APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Wild Survival 3D APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK (API 36)
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Ensure Android SDK Licenses Accepted
        run: (yes || true) | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore or generate debug signing keystore
        run: |
          if [ ! -s debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK output
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          mkdir -p release-apk
          cp "$APK_PATH" release-apk/WildSurvival3D-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WildSurvival3D-debug-apk
          path: release-apk/WildSurvival3D-debug.apk
          retention-days: 90

      - name: Publish Latest APK to GitHub Releases
        id: release_step
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Wild Survival 3D - Latest Android APK
          body: |
            Automated Android APK build for **වනාන්තර පැවැත්ම 3D (Wild Survival 3D)**.
            Download **WildSurvival3D-debug.apk** below and install on Android (Android 7.0+ / API 24+).
          files: release-apk/WildSurvival3D-debug.apk
          prerelease: false

      - name: Build Summary
        if: always()
        run: |
          echo "### Wild Survival 3D APK Build" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Download:** Scroll down to **Artifacts** -> **WildSurvival3D-debug-apk**" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.release_step.outcome }}" != "success" ]; then
            echo "- **GitHub Release Skipped:** Enable *Settings -> Actions -> General -> Workflow permissions -> Read and write permissions* to also auto-publish under Releases." >> $GITHUB_STEP_SUMMARY
          fi
